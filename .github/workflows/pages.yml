name: Website

# Publishes the README, articles and privacy page as a website on GitHub Pages
# at https://drvpntm.github.io/app/ (Settings → Pages → Source must be "GitHub Actions").
# The DrvpnTM.github.io repository builds the same site for the root address https://drvpntm.github.io/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.md'
      - 'docs/icons/**'
      - 'site/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Build the website
        env:
          SITE_URL: https://drvpntm.github.io/app/
          # Optional: the code from Search Console's "HTML tag" method (Settings → Variables).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          pip install mkdocs-material==9.8.0 mkdocs-static-i18n==1.3.1
          python3 site/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
