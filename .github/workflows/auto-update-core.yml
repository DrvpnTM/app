name: Auto-update Xray core

# Checks for a newer Xray core (PattN's patterniha/AndroidLibXrayLite release) on a schedule. When one appears,
# it bumps the pinned core tag and the app version, then tags a release so the app updates itself.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the build workflow after the bump

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest Xray core and bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/patterniha/AndroidLibXrayLite/releases/latest)
          latest=$(echo "$json" | grep -oE '"tag_name":[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          published=$(echo "$json" | grep -oE '"published_at":[[:space:]]*"[^"]+"' | head -1 | sed -E 's/.*"([^"]+)"$/\1/')
          if [ -z "$latest" ]; then echo "Could not read latest tag"; exit 0; fi
          current=$(tr -d '[:space:]' < core-version.txt)
          echo "current=$current latest=$latest published=$published"
          if [ "$latest" = "$current" ]; then
            echo "Already on the latest core; nothing to do."
            exit 0
          fi

          # Wait 3 days after the core release before adopting it (soak/stability window).
          if [ -n "$published" ]; then
            pub_ts=$(date -d "$published" +%s 2>/dev/null || echo 0)
            now_ts=$(date +%s)
            age_days=$(( (now_ts - pub_ts) / 86400 ))
            echo "core release age: ${age_days} day(s)"
            if [ "$pub_ts" -gt 0 ] && [ "$age_days" -lt 3 ]; then
              echo "Latest core is less than 3 days old; waiting before updating."
              exit 0
            fi
          fi

          # 1) point the build at the new core. It lives in core-version.txt, not in a workflow
          #    file, because GITHUB_TOKEN is not allowed to push changes to .github/workflows/.
          echo "${latest}" > core-version.txt

          # 2) bump the app's OWN version: patch +1 (e.g. 0.0.1 -> 0.0.2), versionCode +1.
          #    The app version is independent of the Xray core version.
          gradle=android/app/build.gradle.kts
          code=$(grep -oE 'versionCode = [0-9]+' "$gradle" | grep -oE '[0-9]+')
          newcode=$((code + 1))
          cur=$(grep -oE 'versionName = "[^"]+"' "$gradle" | sed -E 's/.*"([^"]+)".*/\1/')
          major=$(echo "$cur" | cut -d. -f1); minor=$(echo "$cur" | cut -d. -f2); patch=$(echo "$cur" | cut -d. -f3)
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          ver="${major}.${minor}.$((patch + 1))"
          sed -i "s|versionCode = ${code}|versionCode = ${newcode}|" "$gradle"
          sed -i "s|versionName = \"[^\"]*\"|versionName = \"${ver}\"|" "$gradle"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core-version.txt "$gradle"
          git commit -m "Auto-update Xray core to ${latest} and bump app to ${ver} (${newcode})"
          git push origin HEAD:main

          # 3) start the build. Pushes made with GITHUB_TOKEN don't trigger other workflows,
          #    but workflow_dispatch does. Building main publishes release v${ver} (and its tag),
          #    which the in-app updater picks up; country editions rebuild after it.
          gh workflow run build.yml --ref main
