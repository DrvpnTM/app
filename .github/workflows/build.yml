name: Build Dr VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Xray core bundle (AndroidLibXrayLite release). auto-update-core.yml bumps this
  # whenever a newer Xray core is published.
  LIBV2RAY_TAG: v26.9.9
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libhevtun
        id: cache-libhevtun
        uses: actions/cache@v4
        with:
          path: libs
          key: libhevtun-${{ env.NDK_VERSION }}-${{ hashFiles('compile-hevtun.sh', '.gitmodules') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app/

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -fsSL -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_TAG}/libv2ray.aar"

      - name: Decrypt release keystore
        id: keystore
        env:
          DRVPN_KEYSTORE_ENC_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_ENC_PASSWORD }}
        run: |
          if [ -n "$DRVPN_KEYSTORE_ENC_PASSWORD" ] && [ -f V2rayNG/app/drvpn-release.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in V2rayNG/app/drvpn-release.jks.enc \
                 -out "$RUNNER_TEMP/drvpn-release.jks" \
                 -pass pass:"$DRVPN_KEYSTORE_ENC_PASSWORD"; then
              echo "DRVPN_KEYSTORE_FILE=$RUNNER_TEMP/drvpn-release.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Decrypted release keystore ($(wc -c < "$RUNNER_TEMP/drvpn-release.jks") bytes)."
            else
              echo "Keystore decryption failed (wrong password?); falling back to debug signing."
            fi
          else
            echo "No keystore password secret; will fall back to debug signing."
          fi

      - name: Build APK
        working-directory: V2rayNG
        env:
          DRVPN_KEYSTORE_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_PASSWORD }}
          DRVPN_KEY_ALIAS: ${{ secrets.DRVPN_KEY_ALIAS }}
          DRVPN_KEY_PASSWORD: ${{ secrets.DRVPN_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache assemblePlaystoreRelease

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-universal
          path: V2rayNG/app/build/outputs/apk/playstore/release/*universal*.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-arm64-v8a
          path: V2rayNG/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk

      - name: Read app version
        id: appver
        run: |
          ver=$(grep -oE 'versionName = "[^"]+"' V2rayNG/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: ${{ steps.keystore.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
        uses: softprops/action-gh-release@v2
        with:
          files: V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          tag_name: v${{ steps.appver.outputs.version }}
          name: Dr VPN v${{ steps.appver.outputs.version }}
          generate_release_notes: true
