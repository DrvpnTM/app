name: Build Dr VPN APK

on:
  workflow_dispatch:
  push:
    # Every branch is built and tested; only main and v* tags publish a release (see "release").
    branches:
      - '**'
    tags:
      - 'v*'
    # Text and pictures alone (READMEs, articles, docs, notice.json) don't make a new version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'countries/**'
      - 'fastlane/**'
      - 'notice.json'
      - 'LICENSE'

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865

jobs:
  # The Xray core (libv2ray.aar), built by build-core.sh from PattN's patched core for the tag in
  # core-version.txt. Each tag is built once and kept as a "core-<tag>" pre-release, which the
  # in-app updater ignores (it reads only "v*" tags).
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download the built core
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < core-version.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p out
          if gh release download "core-$tag" --repo "$GITHUB_REPOSITORY" -p libv2ray.aar -D out; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.cached.outputs.hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Setup Android SDK
        if: steps.cached.outputs.hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Build the core
        if: steps.cached.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          tag="${{ steps.cached.outputs.tag }}"
          bash build-core.sh "$tag" out/libv2ray.aar
          test -s out/libv2ray.aar
          # Keep it for the next runs, unless another run has published it meanwhile.
          if gh release view "core-$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release core-$tag exists already; not replacing it."
          else
            gh release create "core-$tag" out/libv2ray.aar --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "Xray core $tag" \
              --notes "libv2ray.aar built by build-core.sh from patterniha/AndroidLibXrayLite $tag for Android 7+."
          fi

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray
          path: out/libv2ray.aar
          if-no-files-found: error

  # The Aether core and its Psiphon and Tor helpers (compile-aether.sh), for the commit in
  # aether-version.txt. Built once per commit and kept as an "aether-<commit>" pre-release.
  aether:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download the built Aether
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(tr -d '[:space:]' < aether-version.txt)
          short=${commit:0:12}
          echo "tag=aether-$short" >> "$GITHUB_OUTPUT"
          if gh release download "aether-$short" --repo "$GITHUB_REPOSITORY" -p libs-aether.tar.gz; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.cached.outputs.hit != 'true'
        uses: actions/setup-go@v5
        with:
          # The Go line Psiphon's go.mod asks for (as in PattNG).
          go-version: '1.26'
          cache: false

      - name: Setup Rust
        if: steps.cached.outputs.hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Android SDK
        if: steps.cached.outputs.hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Build Aether
        if: steps.cached.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          export NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          bash compile-aether.sh
          tar czf libs-aether.tar.gz libs-aether
          tag="${{ steps.cached.outputs.tag }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" libs-aether.tar.gz --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false --title "Aether $tag" \
              --notes "Aether core, Psiphon client and lyrebird built by compile-aether.sh from patterniha/Aether $(cat aether-version.txt)."
          fi

      - name: Upload Aether
        uses: actions/upload-artifact@v4
        with:
          name: libs-aether
          path: libs-aether.tar.gz
          if-no-files-found: error

  unit-tests:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Get libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray
          path: android/app/libs

      - name: Run unit tests
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache testPlaystoreDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

  build:
    needs: [core, aether]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libhevtun
        id: cache-libhevtun
        uses: actions/cache@v4
        with:
          path: libs
          key: libhevtun-${{ env.NDK_VERSION }}-${{ hashFiles('compile-hevtun.sh', '.gitmodules') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs android/app/

      - name: Get Aether
        uses: actions/download-artifact@v4
        with:
          name: libs-aether

      - name: Copy Aether
        run: |
          tar xzf libs-aether.tar.gz
          for abi in libs-aether/*/; do
            mkdir -p "android/app/libs/$(basename "$abi")"
            cp "$abi"*.so "android/app/libs/$(basename "$abi")/"
          done

      - name: Get libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray
          path: android/app/libs

      - name: Decrypt release keystore
        id: keystore
        env:
          DRVPN_KEYSTORE_ENC_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_ENC_PASSWORD }}
        run: |
          if [ -n "$DRVPN_KEYSTORE_ENC_PASSWORD" ] && [ -f android/app/drvpn-release.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in android/app/drvpn-release.jks.enc \
                 -out "$RUNNER_TEMP/drvpn-release.jks" \
                 -pass pass:"$DRVPN_KEYSTORE_ENC_PASSWORD"; then
              echo "DRVPN_KEYSTORE_FILE=$RUNNER_TEMP/drvpn-release.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Decrypted release keystore ($(wc -c < "$RUNNER_TEMP/drvpn-release.jks") bytes)."
            else
              echo "Keystore decryption failed (wrong password?); falling back to debug signing."
            fi
          else
            echo "No keystore password secret; will fall back to debug signing."
          fi

      - name: Build APK
        working-directory: android
        env:
          DRVPN_KEYSTORE_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_PASSWORD }}
          DRVPN_KEY_ALIAS: ${{ secrets.DRVPN_KEY_ALIAS }}
          DRVPN_KEY_PASSWORD: ${{ secrets.DRVPN_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache assemblePlaystoreRelease

      - name: Check the Aether programs in the APKs
        run: |
          status=0
          for apk in android/app/build/outputs/apk/playstore/release/*.apk; do
            entries=$(unzip -Z1 "$apk" | grep '^lib/' || true)
            for abi in arm64-v8a armeabi-v7a x86_64; do
              echo "$entries" | grep -q "^lib/$abi/" || continue
              for lib in libaether.so libpsiphon-tunnel-core.so liblyrebird.so; do
                echo "$entries" | grep -qx "lib/$abi/$lib" || { echo "::error::$(basename "$apk") lacks lib/$abi/$lib"; status=1; }
              done
            done
          done
          exit $status

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-universal
          path: android/app/build/outputs/apk/playstore/release/*universal*.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-arm64-v8a
          path: android/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk

      - name: Upload all release APKs
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/playstore/release/*.apk

      - name: Read app version
        id: appver
        run: |
          ver=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
      version: ${{ steps.appver.outputs.version }}

  # Publishes only when the signed build AND the unit tests succeeded, and only from main or a tag
  # (the dev branch builds test APKs without releasing them).
  release:
    needs: [build, unit-tests]
    if: ${{ needs.build.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: apks

      # DrVPN.apk: the universal APK under a name that stays the same, so
      # releases/latest/download/DrVPN.apk always gives the newest version. The in-app
      # updater picks APKs by the ABI in their name, so it leaves this one alone.
      - name: Add DrVPN.apk
        run: cp apks/*universal*.apk apks/DrVPN.apk

      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/release-body.md
          sparse-checkout-cone-mode: false
          path: repo

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: repo/.github/release-body.md
          files: apks/*.apk
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dr VPN v${{ needs.build.outputs.version }}
          make_latest: "true"
          generate_release_notes: true
