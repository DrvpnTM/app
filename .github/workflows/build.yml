name: Build Dr VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NDK_VERSION: 29.0.14206865

jobs:
  # The Xray core (libv2ray.aar), built by build-core.sh from PattN's patched core for the tag in
  # core-version.txt. Each tag is built once and kept as a "core-<tag>" pre-release, which the
  # in-app updater ignores (it reads only "v*" tags).
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download the built core
        id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < core-version.txt)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p out
          if gh release download "core-$tag" --repo "$GITHUB_REPOSITORY" -p libv2ray.aar -D out; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.cached.outputs.hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Setup Android SDK
        if: steps.cached.outputs.hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Build the core
        if: steps.cached.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          tag="${{ steps.cached.outputs.tag }}"
          bash build-core.sh "$tag" out/libv2ray.aar
          # Keep it for the next runs; another run may have published it meanwhile.
          gh release create "core-$tag" out/libv2ray.aar --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false --title "Xray core $tag" \
            --notes "libv2ray.aar built by build-core.sh from patterniha/AndroidLibXrayLite $tag for Android 7+." \
            || echo "Release core-$tag exists already; not replacing it."

      - name: Upload the core
        uses: actions/upload-artifact@v4
        with:
          name: libv2ray
          path: out/libv2ray.aar

  unit-tests:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Get libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray
          path: android/app/libs

      - name: Run unit tests
        working-directory: android
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache testPlaystoreDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

  build:
    needs: core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libhevtun
        id: cache-libhevtun
        uses: actions/cache@v4
        with:
          path: libs
          key: libhevtun-${{ env.NDK_VERSION }}-${{ hashFiles('compile-hevtun.sh', '.gitmodules') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs android/app/

      - name: Get libv2ray.aar
        uses: actions/download-artifact@v4
        with:
          name: libv2ray
          path: android/app/libs

      - name: Decrypt release keystore
        id: keystore
        env:
          DRVPN_KEYSTORE_ENC_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_ENC_PASSWORD }}
        run: |
          if [ -n "$DRVPN_KEYSTORE_ENC_PASSWORD" ] && [ -f android/app/drvpn-release.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in android/app/drvpn-release.jks.enc \
                 -out "$RUNNER_TEMP/drvpn-release.jks" \
                 -pass pass:"$DRVPN_KEYSTORE_ENC_PASSWORD"; then
              echo "DRVPN_KEYSTORE_FILE=$RUNNER_TEMP/drvpn-release.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Decrypted release keystore ($(wc -c < "$RUNNER_TEMP/drvpn-release.jks") bytes)."
            else
              echo "Keystore decryption failed (wrong password?); falling back to debug signing."
            fi
          else
            echo "No keystore password secret; will fall back to debug signing."
          fi

      - name: Build APK
        working-directory: android
        env:
          DRVPN_KEYSTORE_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_PASSWORD }}
          DRVPN_KEY_ALIAS: ${{ secrets.DRVPN_KEY_ALIAS }}
          DRVPN_KEY_PASSWORD: ${{ secrets.DRVPN_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache assemblePlaystoreRelease

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-universal
          path: android/app/build/outputs/apk/playstore/release/*universal*.apk

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: DrVPN-arm64-v8a
          path: android/app/build/outputs/apk/playstore/release/*arm64-v8a*.apk

      - name: Upload all release APKs
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: android/app/build/outputs/apk/playstore/release/*.apk

      - name: Read app version
        id: appver
        run: |
          ver=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"

    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
      version: ${{ steps.appver.outputs.version }}

  # Publishes only when the signed build AND the unit tests succeeded, and only from main or a tag
  # (the dev branch builds test APKs without releasing them).
  release:
    needs: [build, unit-tests]
    if: ${{ needs.build.outputs.signed == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release APKs
        uses: actions/download-artifact@v4
        with:
          name: release-apks
          path: apks

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Dr VPN v${{ needs.build.outputs.version }}
          make_latest: "true"
          generate_release_notes: true
