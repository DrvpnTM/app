name: Build country versions

# Builds one "VPN IP <Country>" APK per country (countries.json) with its own
# applicationId, and attaches them all to a single GitHub release.
on:
  workflow_dispatch:
  # Rebuild every country edition automatically after a successful main build, but only
  # when the app version changed (a countries-v<version> release does not exist yet).
  workflow_run:
    workflows: ["Build Dr VPN APK"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

env:
  # Xray core bundle (AndroidLibXrayLite release). auto-update-core.yml bumps this
  # whenever a newer Xray core is published.
  LIBV2RAY_TAG: v26.9.9
  NDK_VERSION: 29.0.14206865

jobs:
  setup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.m.outputs.skip }}
      matrix: ${{ steps.m.outputs.matrix }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          echo "matrix=$(jq -c . countries.json)" >> "$GITHUB_OUTPUT"
          ver=$(grep -oE 'versionName = "[^"]+"' android/app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=countries-v$ver" >> "$GITHUB_OUTPUT"
          # Skip automatic runs when this version's country release already exists.
          if [ "${{ github.event_name }}" = "workflow_run" ] && gh release view "countries-v$ver" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create release
        if: ${{ steps.m.outputs.skip != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.m.outputs.tag }}
          name: Dr VPN country editions ${{ steps.m.outputs.tag }}
          body: One "VPN IP <Country>" build per country. Download the APK named with your country code.
          make_latest: "false"

  build:
    needs: setup
    if: ${{ needs.setup.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        country: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache libhevtun
        id: cache-libhevtun
        uses: actions/cache@v4
        with:
          path: libs
          key: libhevtun-${{ env.NDK_VERSION }}-${{ hashFiles('compile-hevtun.sh', '.gitmodules') }}

      - name: Build libhevtun
        if: steps.cache-libhevtun.outputs.cache-hit != 'true'
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs android/app/

      - name: Download libv2ray.aar
        run: |
          mkdir -p android/app/libs
          curl -fsSL -o android/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_TAG}/libv2ray.aar"

      - name: Decrypt release keystore
        id: keystore
        env:
          DRVPN_KEYSTORE_ENC_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_ENC_PASSWORD }}
        run: |
          if [ -n "$DRVPN_KEYSTORE_ENC_PASSWORD" ] && [ -f android/app/drvpn-release.jks.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 \
                 -in android/app/drvpn-release.jks.enc \
                 -out "$RUNNER_TEMP/drvpn-release.jks" \
                 -pass pass:"$DRVPN_KEYSTORE_ENC_PASSWORD"; then
              echo "DRVPN_KEYSTORE_FILE=$RUNNER_TEMP/drvpn-release.jks" >> "$GITHUB_ENV"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              echo "Decrypted release keystore ($(wc -c < "$RUNNER_TEMP/drvpn-release.jks") bytes)."
            else
              echo "Keystore decryption failed (wrong password?); falling back to debug signing."
            fi
          else
            echo "No keystore password secret; will fall back to debug signing."
          fi

      - name: Build APK
        working-directory: android
        env:
          DRVPN_KEYSTORE_PASSWORD: ${{ secrets.DRVPN_KEYSTORE_PASSWORD }}
          DRVPN_KEY_ALIAS: ${{ secrets.DRVPN_KEY_ALIAS }}
          DRVPN_KEY_PASSWORD: ${{ secrets.DRVPN_KEY_PASSWORD }}
          COUNTRY_CODE: ${{ matrix.country.code }}
          COUNTRY_NAME: ${{ matrix.country.name }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew --no-daemon --build-cache \
            -PCOUNTRY_CODE="$COUNTRY_CODE" -PCOUNTRY_NAME="$COUNTRY_NAME" \
            assemblePlaystoreRelease

      - name: Attach to release
        if: ${{ steps.keystore.outputs.signed == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          make_latest: "false"
          files: android/app/build/outputs/apk/playstore/release/*universal*.apk
