name: Deploy stats panel

# Deploys stats-worker/ (the admin panel and the app's anonymous stats) to Cloudflare whenever it
# changes on main, or by hand from the Actions tab. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template (dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown on the Workers & Pages overview page
# Without them the job only says what is missing. The database updates itself on the first
# request, so no SQL is run here.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'stats-worker/**'
      - '.github/workflows/stats-worker.yml'

permissions:
  contents: read

concurrency:
  group: stats-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the stats panel."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: stats-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 deploy

      - name: Check the deployed panel
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # /health exists only in the new panel: 401 (login needed) means it is the one running.
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://drvpn-stats.cdn-1-4cf.workers.dev/health)
          echo "GET /health -> $code"
          [ "$code" = "401" ] || { echo "::error::The panel did not answer as the new version (got $code)"; exit 1; }
