<svg xmlns="http://www.w3.org/2000/svg" width="360" height="112" viewBox="0 0 360 112">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC6FF"/>
      <stop offset="0.55" stop-color="#2AA3EF"/>
      <stop offset="1" stop-color="#0B79C7"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A5F9E"/>
      <stop offset="1" stop-color="#08497A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF1FF"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#05284A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 3D base and face -->
  <rect x="10" y="14" width="340" height="86" rx="43" fill="url(#edge)" filter="url(#shadow)"/>
  <rect x="10" y="6" width="340" height="86" rx="43" fill="url(#body)"/>
  <rect x="24" y="10" width="312" height="36" rx="18" fill="url(#shine)"/>
  <!-- round badge with an icon -->
  <circle cx="58" cy="49" r="34" fill="url(#ball)"/>
  <path d="M34 48 L80 30 L70 72 L56 60 L48 70 L47 56 Z" fill="#0B79C7" stroke="#0B79C7" stroke-width="3" stroke-linejoin="round"/>
  <path d="M47 56 L76 34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <!-- label -->
  <text x="212" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1">TELEGRAM</text>
  <text x="212" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#E8F6FF" letter-spacing="2">@drVPN_net</text>
</svg>
