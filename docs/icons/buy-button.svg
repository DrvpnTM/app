<svg xmlns="http://www.w3.org/2000/svg" width="360" height="112" viewBox="0 0 360 112">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#F27A1A"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A3412"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8CC"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#5A1E06" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 3D base and face -->
  <rect x="10" y="14" width="340" height="86" rx="43" fill="url(#edge)" filter="url(#shadow)"/>
  <rect x="10" y="6" width="340" height="86" rx="43" fill="url(#body)"/>
  <rect x="24" y="10" width="312" height="36" rx="18" fill="url(#shine)"/>
  <!-- round badge with an icon -->
  <circle cx="58" cy="49" r="34" fill="url(#ball)"/>
  <path d="M63 22 L42 53 H56 L51 76 L74 42 H60 Z" fill="#C2410C" stroke="#C2410C" stroke-width="3" stroke-linejoin="round"/>
  <!-- label -->
  <text x="212" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1">drvpn.net</text>
  <text x="212" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#FFF4E6" letter-spacing="2">HIGH-SPEED VPN</text>
</svg>
