<svg xmlns="http://www.w3.org/2000/svg" width="360" height="112" viewBox="0 0 360 112">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE38E"/>
      <stop offset="0.55" stop-color="#22B45C"/>
      <stop offset="1" stop-color="#138A41"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6E33"/>
      <stop offset="1" stop-color="#0A5226"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F7E4"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B3D1E" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 3D base and face -->
  <rect x="10" y="14" width="340" height="86" rx="43" fill="url(#edge)" filter="url(#shadow)"/>
  <rect x="10" y="6" width="340" height="86" rx="43" fill="url(#body)"/>
  <rect x="24" y="10" width="312" height="36" rx="18" fill="url(#shine)"/>
  <!-- round badge with a down arrow into a tray -->
  <circle cx="58" cy="49" r="34" fill="url(#ball)"/>
  <path d="M58 26 v26 M46 41 l12 13 l12 -13" fill="none" stroke="#138A41" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 58 v8 a4 4 0 0 0 4 4 h28 a4 4 0 0 0 4 -4 v-8" fill="none" stroke="#138A41" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- label -->
  <text x="212" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="1">DOWNLOAD</text>
  <text x="212" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#EFFFF4" letter-spacing="2">ANDROID · APK</text>
</svg>
